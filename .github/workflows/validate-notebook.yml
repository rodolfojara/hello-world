name: Validate exploratory notebook

on:
  push:
    branches:
      - cleanup/small-satellite-tracking-study
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install notebook dependencies
        run: python -m pip install --upgrade pip astropy matplotlib nbconvert
      - name: Execute notebook
        run: >-
          jupyter nbconvert
          --to notebook
          --execute
          --ExecutePreprocessor.timeout=120
          --output executed-notebook.ipynb
          --output-dir /tmp
          analysis/coordinate-matching-exploration.ipynb
